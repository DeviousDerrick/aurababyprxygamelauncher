<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Tools</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Nunito', sans-serif;
            background: #0f0f1a;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        body::before, body::after {
            content: '';
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.25;
            animation: drift 8s ease-in-out infinite alternate;
            pointer-events: none;
        }
        body::before {
            width: 400px; height: 400px;
            background: #5b5ef4;
            top: -100px; left: -100px;
        }
        body::after {
            width: 350px; height: 350px;
            background: #ff6b6b;
            bottom: -80px; right: -80px;
            animation-delay: -4s;
        }
        @keyframes drift {
            from { transform: translate(0,0) scale(1); }
            to   { transform: translate(30px,20px) scale(1.1); }
        }
        .card {
            position: relative;
            z-index: 1;
            background: rgba(255,255,255,0.05);
            border: 1.5px solid rgba(255,255,255,0.1);
            border-radius: 24px;
            padding: 48px 44px;
            text-align: center;
            backdrop-filter: blur(12px);
            max-width: 380px;
            width: 90%;
            box-shadow: 0 25px 60px rgba(0,0,0,0.5);
        }
        .icon {
            font-size: 4em;
            margin-bottom: 16px;
            display: block;
            animation: float 3s ease-in-out infinite;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50%       { transform: translateY(-8px); }
        }
        h1 {
            font-size: 1.9em;
            font-weight: 900;
            color: #fff;
            margin-bottom: 8px;
        }
        .sub {
            color: rgba(255,255,255,0.45);
            font-size: 0.88em;
            margin-bottom: 36px;
            letter-spacing: 0.5px;
        }
        .launch-btn {
            display: block;
            background: linear-gradient(135deg, #5b5ef4, #764ba2);
            color: #fff;
            font-family: 'Nunito', sans-serif;
            font-size: 1.1em;
            font-weight: 800;
            padding: 16px 44px;
            border-radius: 50px;
            border: none;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.34,1.56,0.64,1);
            box-shadow: 0 8px 25px rgba(91,94,244,0.5);
            width: 100%;
            text-decoration: none;
            line-height: 1;
        }
        .launch-btn:hover {
            transform: translateY(-4px) scale(1.03);
            box-shadow: 0 14px 35px rgba(91,94,244,0.65);
        }
    </style>
</head>
<body>
    <div class="card">
        <span class="icon">🎮</span>
        <h1>Game Launcher</h1>
        <p class="sub">OPENS IN A NEW TAB</p>
        <a class="launch-btn" href="/" target="_blank">▶ &nbsp; Open Games</a>
    </div>
</body>
</html>
