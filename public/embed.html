<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Tools</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Nunito', sans-serif;
            background: #0f0f1a;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* Animated background blobs */
        body::before, body::after {
            content: '';
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.25;
            animation: drift 8s ease-in-out infinite alternate;
            pointer-events: none;
        }
        body::before {
            width: 400px; height: 400px;
            background: #5b5ef4;
            top: -100px; left: -100px;
        }
        body::after {
            width: 350px; height: 350px;
            background: #ff6b6b;
            bottom: -80px; right: -80px;
            animation-delay: -4s;
        }
        @keyframes drift {
            from { transform: translate(0, 0) scale(1); }
            to   { transform: translate(30px, 20px) scale(1.1); }
        }

        .card {
            position: relative;
            z-index: 1;
            background: rgba(255,255,255,0.05);
            border: 1.5px solid rgba(255,255,255,0.1);
            border-radius: 24px;
            padding: 48px 44px;
            text-align: center;
            backdrop-filter: blur(12px);
            max-width: 380px;
            width: 90%;
            box-shadow: 0 25px 60px rgba(0,0,0,0.5);
        }

        .icon {
            font-size: 4em;
            margin-bottom: 16px;
            display: block;
            animation: float 3s ease-in-out infinite;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50%       { transform: translateY(-8px); }
        }

        h1 {
            font-size: 1.9em;
            font-weight: 900;
            color: #fff;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        .sub {
            color: rgba(255,255,255,0.45);
            font-size: 0.88em;
            margin-bottom: 36px;
            letter-spacing: 0.5px;
        }

        .launch-btn {
            display: inline-block;
            background: linear-gradient(135deg, #5b5ef4, #764ba2);
            color: #fff;
            font-family: 'Nunito', sans-serif;
            font-size: 1.1em;
            font-weight: 800;
            padding: 16px 44px;
            border-radius: 50px;
            border: none;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 8px 25px rgba(91, 94, 244, 0.5);
            letter-spacing: 0.3px;
            width: 100%;
        }

        .launch-btn:hover {
            transform: translateY(-4px) scale(1.03);
            box-shadow: 0 14px 35px rgba(91, 94, 244, 0.65);
        }

        .launch-btn:active {
            transform: translateY(0) scale(0.98);
        }

        /* Popup blocked warning */
        #popup-warning {
            display: none;
            margin-top: 18px;
            background: rgba(255, 107, 107, 0.15);
            border: 1px solid rgba(255, 107, 107, 0.4);
            border-radius: 12px;
            padding: 14px 16px;
            color: #ffaaaa;
            font-size: 0.85em;
            line-height: 1.5;
            text-align: left;
        }

        #popup-warning strong {
            color: #ff8e8e;
            display: block;
            margin-bottom: 4px;
        }

        .dots span {
            display: inline-block;
            width: 6px; height: 6px;
            background: #fff;
            border-radius: 50%;
            margin: 0 3px;
            opacity: 0.3;
            animation: blink 1.2s ease-in-out infinite;
        }
        .dots span:nth-child(2) { animation-delay: 0.2s; }
        .dots span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes blink {
            0%, 80%, 100% { opacity: 0.3; }
            40%            { opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="card">
        <span class="icon">🎮</span>
        <h1>Game Launcher</h1>
        <p class="sub">OPENS IN A NEW TAB</p>

        <button class="launch-btn" onclick="openLauncher()" id="btn">
            ▶ &nbsp; Open Games
        </button>

        <div id="popup-warning">
            <strong>⚠️ Allow Popups!</strong>
            Click the popup blocker icon in your address bar and select <em>"Always allow popups"</em>, then try again.
        </div>
    </div>

    <script>
        function openLauncher() {
            const btn = document.getElementById('btn');
            btn.innerHTML = 'Opening <span class="dots"><span></span><span></span><span></span></span>';
            btn.disabled = true;

            // Open about:blank immediately (must be synchronous to avoid popup block)
            const win = window.open('about:blank', '_blank');

            if (!win || win.closed || typeof win.closed === 'undefined') {
                // Popup was blocked
                document.getElementById('popup-warning').style.display = 'block';
                btn.innerHTML = '▶ &nbsp; Open Games';
                btn.disabled = false;
                return;
            }

            // Write the disguised launcher into the new tab
            win.document.open();
            win.document.write(`<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schoology</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #1a1a2e; }
        iframe { width: 100%; height: 100vh; border: none; display: block; }
        #loader {
            position: fixed; inset: 0;
            background: #1a1a2e;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            z-index: 9999;
            font-family: sans-serif; color: #fff;
            transition: opacity 0.5s ease;
        }
        #loader .spinner {
            width: 40px; height: 40px;
            border: 4px solid rgba(255,255,255,0.15);
            border-top-color: #5b5ef4;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            margin-bottom: 18px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        #loader p { font-size: 0.95em; opacity: 0.6; }
    </style>
</head>
<body>
    <div id="loader">
        <div class="spinner"></div>
        <p>Loading Schoology...</p>
    </div>
    <iframe id="gf" onload="document.getElementById('loader').style.opacity='0'; setTimeout(()=>document.getElementById('loader').style.display='none',500)"></iframe>
    <script>
        // Set src after write to avoid blocking
        window.onload = function() {
            document.getElementById('gf').src = window.location.origin + '/';
        };
    <\/script>
</body>
</html>`);
            win.document.close();

            // Reset button after short delay
            setTimeout(() => {
                btn.innerHTML = '▶ &nbsp; Open Games';
                btn.disabled = false;
            }, 2000);
        }
    </script>
</body>
</html>
